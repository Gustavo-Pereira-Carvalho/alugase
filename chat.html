<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat | Alugase</title>
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/chat.css">
</head>
<body>

<header>
<nav class="navbar">
<div class="logo"><a href="index.html"><h2>ALUGASE</h2></a></div>
<div class="nav-buttons">
<a href="perfil.html" class="btn-secondary">Meu Perfil</a>
</div>
</nav>
</header>

<main class="chat-page">

<aside class="chat-sidebar">
<div class="sidebar-header"><h2>Conversas</h2></div>
<div id="conversation-list"></div>
</aside>

<section class="chat-area">

<div class="chat-header">
<div class="chat-user">
<div class="avatar" id="chat-avatar">C</div>
<div>
<h3 id="chat-name">Carlos Almeida</h3>
<span id="chat-status">Online</span>
</div>
</div>
<a id="view-product" class="btn-secondary">Ver produto</a>
</div>

<div class="reservation-card">
<div class="reservation-top">
<div>
<span class="status" id="reservation-status">Solicitado</span>
<h3 id="reservation-product">Câmera Canon EOS</h3>
<p id="reservation-period">18/08/2026 até 20/08/2026</p>
</div>
<div class="reservation-price" id="reservation-total">R$ 460</div>
</div>
<div class="reservation-info">
<div><span>Diárias</span><strong id="reservation-days">3 dias</strong></div>
<div><span>Entrega</span><strong id="reservation-delivery">Retirada</strong></div>
<div><span>Caução</span><strong id="reservation-deposit">R$ 300</strong></div>
</div>
</div>

<div class="messages" id="messages"></div>

<div class="message-box">
<input id="message-input" type="text" placeholder="Digite uma mensagem...">
<button id="send-btn" class="btn-primary">Enviar</button>
</div>

</section>

</main>

<script src="./js/chat.js"></script>
</body>
</html>
