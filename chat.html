<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat | Alugase</title>

    <link rel="stylesheet" href="./css/global.css">

    <link rel="stylesheet" href="./css/chat.css">

</head>


<body>

<!-- ==========================================
     ALUGASE — HEADER
========================================== -->

<header>

    <nav class="navbar">

        <!-- ==================================
             LOGO
        =================================== -->

        <div class="logo">

            <a href="index.html">

                <img
                    src="assets/logo.png"
                    alt="Logo Alugase"
                >

                <h2>ALUGASE</h2>

            </a>

        </div>


        <!-- ==================================
             MENU
        =================================== -->

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Início
                </a>
            </li>

            <li>
                <a href="explorar.html">
                    Explorar
                </a>
            </li>

            <li>
                <a href="index.html#categorias">
                    Categorias
                </a>
            </li>

            <li>
                <a href="index.html#como-funciona">
                    Como funciona
                </a>
            </li>

        </ul>


        <!-- ==================================
             BOTÕES
        =================================== -->

        <div class="nav-buttons">

          <!-- NOTIFICAÇÕES -->

<a
    href="notificacoes.html"
    class="notification-nav"
    aria-label="Notificações"
>

    <span
        class="notification-icon"
        aria-hidden="true"
    >
        <img
            src="assets/notificao.png"
            alt="Notificações"
        >
    </span>

    <span
        class="notification-badge"
        id="notification-badge"
        style="display: none;"
    >
        0
    </span>

</a>

            <!-- PERFIL -->

            <a
                href="perfil.html"
                class="btn-secondary"
            >
                Meu Perfil
            </a>

        </div>

    </nav>

</header>



<!-- ==========================================
     PÁGINA DO CHAT
========================================== -->

<main class="chat-page">


    <!-- ======================================
         SIDEBAR
    ======================================= -->

    <aside class="chat-sidebar">


        <!-- CABEÇALHO -->

        <div class="sidebar-header">

            <h2>
                Conversas
            </h2>

        </div>


        <!-- LISTA DE CONVERSAS -->

        <div id="conversation-list">

            <p
                style="
                    padding:20px;
                    color:#6b7280;
                "
            >
                Carregando conversas...
            </p>

        </div>


    </aside>



    <!-- ======================================
         ÁREA DO CHAT
    ======================================= -->

    <section class="chat-area">


        <!-- ==================================
             HEADER DO CHAT
        =================================== -->

        <div class="chat-header">


            <!-- USUÁRIO -->

            <div class="chat-user">


                <!-- AVATAR -->

                <div
                    class="avatar"
                    id="chat-avatar"
                >
                    C
                </div>


                <!-- INFORMAÇÕES -->

                <div>

                    <h3 id="chat-name">
                        Carlos Almeida
                    </h3>


                    <span id="chat-status">
                        Ativo
                    </span>

                </div>


            </div>


            <!-- VER PRODUTO -->

            <a
                id="view-product"
                class="btn-secondary"
                href="#"
            >
                Ver produto
            </a>


        </div>



<!-- ==========================================
     CARD DO PRODUTO / ALUGUEL
========================================== -->

<div class="reservation-card" id="reservation-card">

    <!-- BOTÃO ABRIR / FECHAR -->

    <button
        id="toggle-reservation"
        class="reservation-toggle"
        type="button"
    >

        <div class="reservation-toggle-content">

            <div class="reservation-icon">
                📦
            </div>

            <div class="reservation-toggle-text">

                <span class="reservation-label">
                    Produto
                </span>

                <strong
                    id="reservation-product-short"
                    class="reservation-toggle-title"
                >
                    Carregando...
                </strong>

            </div>

        </div>

        <span
            id="reservation-arrow"
            class="reservation-arrow"
        >
            ▼
        </span>

    </button>


    <!-- ======================================
         DETALHES
    ======================================= -->

    <div
        id="reservation-details"
        class="reservation-details"
    >

        <!-- ==================================
             PRODUTO
        =================================== -->

        <div class="product-card-info">

            <div
                class="product-card-image"
                id="reservation-product-image"
            >
                📦
            </div>


            <div class="product-card-main">

                <h3 id="reservation-product">
                    Produto
                </h3>

                <p id="reservation-category">
                    Categoria
                </p>

                <p id="reservation-city">
                    📍 Cidade
                </p>

            </div>

        </div>


        <!-- ==================================
             PREÇO DO PRODUTO
        =================================== -->

        <div class="product-pricing">

            <div>

                <span>
                    Preço por dia
                </span>

                <strong id="reservation-price-day">
                    R$ 0,00
                </strong>

            </div>


            <div>

                <span>
                    Caução
                </span>

                <strong id="reservation-product-deposit">
                    R$ 0,00
                </strong>

            </div>


            <div>

                <span>
                    Entrega
                </span>

                <strong id="reservation-product-delivery">
                    --
                </strong>

            </div>

        </div>


        <!-- ==================================
             ALUGUEL
        =================================== -->

        <div class="reservation-rental-info">

            <div class="reservation-top">

                <div>

                    <span
                        class="status"
                        id="reservation-status"
                    >
                        Solicitado
                    </span>


                    <p
                        id="reservation-period"
                    >
                        --
                    </p>

                </div>


                <div
                    class="reservation-price"
                    id="reservation-total"
                >
                    R$ 0,00
                </div>

            </div>


            <div class="reservation-info">

                <div>

                    <span>
                        Diárias
                    </span>

                    <strong
                        id="reservation-days"
                    >
                        --
                    </strong>

                </div>


                <div>

                    <span>
                        Entrega
                    </span>

                    <strong
                        id="reservation-delivery"
                    >
                        --
                    </strong>

                </div>


                <div>

                    <span>
                        Caução
                    </span>

                    <strong
                        id="reservation-deposit"
                    >
                        R$ 0,00
                    </strong>

                </div>

            </div>

        </div>

    </div>

</div>



        <!-- ==================================
             MENSAGENS
        =================================== -->

        <div
            class="messages"
            id="messages"
        >

        </div>



        <!-- ==================================
             CAIXA DE MENSAGEM
        =================================== -->

        <div class="message-box">


            <!-- INPUT -->

            <input
                id="message-input"
                type="text"
                placeholder="Digite uma mensagem..."
                autocomplete="off"
                maxlength="1000"
            >


            <!-- ENVIAR -->

            <button
                id="send-btn"
                class="btn-primary"
                type="button"
            >
                Enviar
            </button>


        </div>


    </section>


</main>



<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script src="./js/chat.js"></script>


</body>

</html>
