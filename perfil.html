<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil | Alugase</title>

  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/perfil.css">
</head>

<body>

<header>
  <nav class="navbar profile-navbar">

    <div class="logo">
      <a href="index.html">
        <img src="assets/logo.png" alt="Logo">
        <h2>ALUGASE</h2>
      </a>
    </div>

    <ul class="nav-links">
      <li><a href="index.html">Início</a></li>
      <li><a href="explorar.html">Explorar</a></li>
    </ul>

    <div class="nav-buttons">

      <a href="solicitacoes.html" class="notification-nav">
        <span class="bell-icon">🔔</span>
        <span id="notification-badge" class="notification-badge">0</span>
      </a>

      <a href="chat.html" class="btn-secondary">
        Conversas
      </a>

      <button id="new-ad" class="btn-primary">
        + Anunciar
      </button>

      <button id="logout" class="btn-secondary">
        Sair
      </button>

    </div>

  </nav>
</header>


<main class="profile-page">

  <section class="profile-header">

    <div class="avatar-container">
      <label id="avatar" for="profile-image-input" class="avatar">
        GP
      </label>

      <input
        type="file"
        id="profile-image-input"
        accept="image/*"
        hidden
      >

      <span class="avatar-hint">
        Clique para alterar
      </span>
    </div>

    <div class="profile-info">

      <div class="name-row">
        <h1 id="user-name">Nome</h1>
        <span id="verified-badge" class="pending">
          Pendente
        </span>
      </div>

      <p id="user-location">
        Cidade
      </p>

      <div class="rating">
        ⭐ 5.0 · 0 avaliações
      </div>

    </div>

  </section>


  <section class="stats-grid">

    <div class="stat-card">
      <h2 id="total-rentals">0</h2>
      <span>Aluguéis</span>
    </div>

    <div class="stat-card">
      <h2 id="total-ads">0</h2>
      <span>Anúncios</span>
    </div>

    <div class="stat-card">
      <h2 id="total-income">R$ 0</h2>
      <span>Renda</span>
    </div>

    <div class="stat-card">
      <h2>5.0</h2>
      <span>Avaliação</span>
    </div>

  </section>


  <section class="tabs">

    <button class="tab active" data-tab="ads">
      Meus anúncios
    </button>

    <button class="tab" data-tab="rentals">
      Aluguéis
    </button>

    <button class="tab" data-tab="verification">
      Verificação
    </button>

  </section>


  <section class="tab-content">

    <div id="ads" class="content active">

      <div id="ads-list"></div>

      <div id="empty-ads" class="empty-state" style="display:none;">
        <h3>Nenhum anúncio</h3>
        <button id="empty-new-ad" class="btn-primary">
          Criar anúncio
        </button>
      </div>

    </div>


    <div id="rentals" class="content">

      <div id="rentals-list"></div>

      <div id="empty-rentals" class="empty-state" style="display:none;">
        <h3>Nenhum aluguel</h3>
      </div>

    </div>


    <div id="verification" class="content">

      <div class="verification-card">

        <h2>Verificação</h2>

        <div class="form-grid">

          <input id="cpf" placeholder="CPF">
          <input id="rg" placeholder="RG">
          <input id="cnh" placeholder="CNH">

          <input id="cep" placeholder="CEP">
          <input id="number" placeholder="Número">

          <input id="street" placeholder="Rua" readonly>
          <input id="district" placeholder="Bairro" readonly>
          <input id="city" placeholder="Cidade" readonly>
          <input id="state" placeholder="Estado" readonly>

        </div>

        <button id="verify-account" class="btn-primary">
          Enviar documentos
        </button>

      </div>

    </div>

  </section>

</main>

<script src="./js/perfil.js"></script>
</body>
</html>
